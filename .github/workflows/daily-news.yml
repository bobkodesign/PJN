name: 파주 뉴스 매일 업데이트

on:
  schedule:
    # UTC 22:05 = 한국시간(KST) 오전 7:05 (1차 — GitHub 지연 감안해 5분 당김)
    - cron: "5 22 * * *"
    # UTC 04:05 = 한국시간(KST) 오후 1:05 (2차 — 1차가 스킵/지연될 경우 보완용)
    - cron: "5 4 * * *"
  workflow_dispatch:  # 수동 실행 버튼도 사용 가능

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 필요한 라이브러리 설치
        run: pip install requests beautifulsoup4 google-genai

      - name: 뉴스 스크랩 및 페이지 생성
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scrape_and_generate.py

      - name: GitHub Pages에 배포
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
